name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Directory Structure
        run: |
          echo "=== Root Folder Contents ==="
          ls -la
          echo "=== Locating package.json ==="
          find . -name "package.json" -not -path "*/node_modules/*"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build Web Assets
        run: |
          # Find directory containing package.json
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json could not be found anywhere in this repository."
            echo "Please push your project source files to GitHub first."
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          echo "Found package.json in directory: $APP_DIR"
          cd "$APP_DIR"
          npm install
          npm run build

      - name: Set up Java / JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          APP_DIR=$(dirname "$PKG_PATH")
          cd "$APP_DIR"
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew file not found. Ensure your capacitor android project is generated."
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"

      - name: Build Debug APK with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          ANDROID_DIR=$(dirname "$GRADLEW_PATH")
          cd "$ANDROID_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/outputs/apk/debug/*.apk"
