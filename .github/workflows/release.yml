name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Install virtual display to prevent headless AWT / KSP crashes
      - name: Install Virtual Framebuffer (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Prepare API keys, SDK directory, and repair build files automatically
      - name: Configure Environment and Fix Build Files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Provide API key and SDK path for AI Studio export
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
          
          # 2. Fix KSP in-process compiler bug
          sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/g' gradle.properties || true
          sed -i 's/org.gradle.jvmargs=/org.gradle.jvmargs=-Djava.awt.headless=true /g' gradle.properties || true

          # 3. Automatically fix Kotlin DSL syntax errors and AI Studio configs
          if [ -f app/build.gradle.kts ]; then
            # Fix Line 142 error: converts "ksp"(...) to add("ksp", ...)
            sed -i 's/"ksp"(\(.*\))/add("ksp", \1)/g' app/build.gradle.kts || true
            
            # Remove AI Studio broken debugConfig reference per README step 5
            sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts || true
            sed -i '/debugConfig/d' app/build.gradle.kts || true
          fi

      - name: Install Gradle Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      # Compile release APK in virtual framebuffer mode
      - name: Build Release APK
        run: xvfb-run --auto-servernum gradle assembleRelease --no-daemon --no-configuration-cache -Djava.awt.headless=true

      # Sign release APK using official Android SDK tools so it installs without errors
      - name: Sign Release APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          # Generate keystore
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias my-alias \
            -storepass androidkey \
            -keypass androidkey \
            -dname "CN=Strawberrycandy, OU=Mobile, O=Apps, L=City, S=State, C=US"

          # Find the raw APK
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p output

          # Align the APK (mandatory for Android installation)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" output/aligned.apk

          # Sign with Android v2/v3 signatures
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks my-release-key.jks \
            --ks-pass pass:androidkey \
            --key-pass pass:androidkey \
            --ks-key-alias my-alias \
            --out output/Strawberrycandy-installable.apk \
            output/aligned.apk

          # Verify signature validity
          $BUILD_TOOLS_DIR/apksigner verify output/Strawberrycandy-installable.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strawberrycandy-app
          path: output/Strawberrycandy-installable.apk
