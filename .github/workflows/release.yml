name: Release StrawberryCandy

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag starting with v (e.g., v1.0, v2.1.3)

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BUILD STEPS (Customize these based on your app's language) ---
      # Example for a Node.js app:
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - run: npm install
      # - run: npm run build
      
      # Example for a Python app:
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      # - run: pip install -r requirements.txt
      # -----------------------------------------------------------------

      - name: Zip Build Artifacts
        run: zip -r strawberrycandy-release.zip . # Zips your app files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: strawberrycandy-release.zip
          name: StrawberryCandy ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
