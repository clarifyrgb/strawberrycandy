name: Android Release Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Gradle Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      # Inject API key and properties before building
      - name: Setup Environment Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      # Sign the unsigned APK so Android devices can install it without "invalid package" errors
      - name: Sign and Align APK
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          mkdir -p signed-output
          # Locate the built unsigned APK
          UNSIGNED_APK=$(find app/build/outputs -name "*release*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No APK found to sign"
            exit 1
          fi
          # Signs with standard v1, v2, and v3 Android signing schemes
          java -jar uber-apk-signer-1.3.0.jar --apks "$UNSIGNED_APK" --out signed-output/
          
          # Rename the final signed APK for clean distribution
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            TAG_NAME="v1.0.0-${{ github.run_number }}"
          fi
          SIGNED_FILE=$(find signed-output -name "*-aligned-signed.apk" | head -n 1)
          cp "$SIGNED_FILE" "signed-output/Strawberrycandy-${TAG_NAME}.apk"
          echo "FINAL_RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      # Upload to Artifacts (downloadable from GitHub Actions run summary)
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strawberrycandy-Signed-APK
          path: signed-output/Strawberrycandy-*.apk

      # Publish directly to GitHub Releases (downloadable from your repository's Releases tab)
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FINAL_RELEASE_TAG }}
          files: signed-output/Strawberrycandy-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
