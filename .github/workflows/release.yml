name: Android Release Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Absolute fix for the KSP engine error and configuring project variables
      - name: Configure Headless Environment & Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
          
          # Force JVM into headless mode and disable KSP incremental processing
          touch gradle.properties
          echo "org.gradle.jvmargs=-Djava.awt.headless=true" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties

      - name: Install Gradle Manually
        run: |
          wget https://gradle.org
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/**/*.apk
