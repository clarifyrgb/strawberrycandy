name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Injects the required API key and fixes missing config
      - name: Configure Environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
          
          # Remove broken signingConfig line per README step 5
          if [ -f app/build.gradle.kts ]; then
            sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts || true
            sed -i '/debugConfig/d' app/build.gradle.kts || true
          fi

      - name: Install Gradle Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      # Generates a key, aligns, and signs the release APK so Android accepts it
      - name: Sign Release APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 1. Create a valid signing key
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias strawberry \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=Strawberrycandy, OU=App, O=AIStudio, L=City, S=State, C=US"

          # 2. Locate the raw release APK
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p output

          # 3. Zipalign (required by Android)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" output/aligned.apk

          # 4. Sign APK with v2/v3 signature
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --ks-key-alias strawberry \
            --out output/Strawberrycandy-signed.apk \
            output/aligned.apk

          # 5. Verify the signature
          $BUILD_TOOLS_DIR/apksigner verify output/Strawberrycandy-signed.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strawberrycandy-app
          path: output/Strawberrycandy-signed.apk
