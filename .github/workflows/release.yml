name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # Injects your Gemini API key into local.properties and .env so secrets-gradle-plugin finds it
      - name: Configure Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Renames the output APK so the version/tag appears cleanly in GitHub Releases
      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/Strawberrycandy-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
