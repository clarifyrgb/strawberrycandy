name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Environment & API Keys
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          API_KEY="${GEMINI_KEY:-AIzaSyDefaultPlaceholderSecretKeyForBuild}"
          touch local.properties
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_PATH" ] && [ -d "$SDK_PATH" ]; then
            echo "sdk.dir=$SDK_PATH" > local.properties
          fi
          echo "GEMINI_API_KEY=${API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${API_KEY}" > .env
          echo "API keys and environment configured."

      - name: Ensure Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore for build..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Gradle Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare and Sign APK
        run: |
          mkdir -p output
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: No release APK found in build outputs!"
            exit 1
          fi

          echo "Found build APK: $RAW_APK"
          # Default fallback: copy the Gradle-built signed APK
          cp "$RAW_APK" output/Strawberrycandy.apk

          # Locate Android build tools for custom re-signing if available
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d ${SDK_DIR}/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "Detected build-tools directory: $BUILD_TOOLS_DIR"

          # Prepare consistent keystore so all releases share the exact same signature,
          # allowing seamless APK updates without uninstalling the previous version.
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/zipalign" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ] && [ -f "debug.keystore" ]; then
            echo "Found zipalign, apksigner, and consistent repository keystore. Signing release..."
            "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$RAW_APK" output/aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out output/Strawberrycandy.apk \
              output/aligned.apk
            echo "Consistent APK signature applied successfully."
          else
            echo "Using Gradle-packaged APK with built-in signature directly."
            cp "$RAW_APK" output/Strawberrycandy.apk
          fi

          ls -lh output/Strawberrycandy.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Strawberrycandy-app
          path: output/Strawberrycandy.apk
