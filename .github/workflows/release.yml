name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Gradle Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      # Injects the required Gemini API key to prevent runtime or build errors
      - name: Setup Environment Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env

      - name: Build Release APK
        run: gradle assembleRelease

      # Generate a signing key and sign the APK with apksigner
      - name: Sign APK with Release Key
        run: |
          # 1. Locate Android SDK build-tools (contains apksigner and zipalign)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 2. Generate a valid signing keystore
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias strawberrykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=Strawberrycandy, OU=App, O=AIStudio, L=City, S=State, C=US"

          # 3. Find the unsigned release APK
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK found in app/build/outputs/apk/release"
            exit 1
          fi

          mkdir -p output

          # 4. Align the APK (required for Android installation)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" output/aligned.apk

          # 5. Sign the APK using v1, v2, and v3 signature schemes
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:androidpassword \
            --key-pass pass:androidpassword \
            --ks-key-alias strawberrykey \
            --out output/Strawberrycandy-release.apk \
            output/aligned.apk

          # 6. Verify signature
          $BUILD_TOOLS_DIR/apksigner verify output/Strawberrycandy-release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/Strawberrycandy-release.apk
