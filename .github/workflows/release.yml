name: Android Release Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Fix for the KSP "AWT-EventQueue" error by forcing headless mode
      - name: Configure Headless Environment & Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
          echo "org.gradle.jvmargs=-Djava.awt.headless=true" >> gradle.properties

      - name: Install Gradle Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/**/*.apk
