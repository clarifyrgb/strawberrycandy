name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
      - name: Install Gradle Manually
        run: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH
      # Compiles using your working release task
      - name: Build Release APK
        run: gradle assembleRelease

      # Signs the APK so Android accepts and opens it
      - name: Sign APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          # Generate signing certificate
          keytool -genkeypair -v \
            -keystore app.keystore \
            -alias appalias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=Strawberrycandy, OU=App, O=AIStudio, L=City, S=State, C=US"
          # Find the unsigned release APK
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p output
          # Zipalign the APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" output/aligned.apk
          # Sign with official Android signature schemes (v1, v2, v3)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks app.keystore \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            --ks-key-alias appalias \
            --out output/Strawberrycandy.apk \
            output/aligned.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strawberrycandy-app
          path: output/Strawberrycandy.apk
