name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Setup Configuration and Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Provide API key in local.properties and .env
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env

          # 2. Fix the AWT / KSP in-process conflict in gradle.properties
          sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/g' gradle.properties

          # 3. Remove broken signingConfig line per README step 5
          if [ -f app/build.gradle.kts ]; then
            sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts || true
            sed -i '/debugConfig/d' app/build.gradle.kts || true
          fi

      # Run using the project wrapper with headless AWT flag to prevent display crashes
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache -Djava.awt.headless=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strawberrycandy-app
          path: app/build/outputs/apk/debug/*.apk
